<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Barrie, Learning and Development</title>
<style>
/* ===================================================================
   ATELIER THEME
   Warm, crafted, studio register. A bound-book brick accent on warm
   card-stock paper, a bookish serif for display, a clean sans for body,
   and a quiet monospaced voice for the small maker's labels.
   Everything is in this one file. No external fonts, scripts or calls.
   =================================================================== */
:root{
  --paper:#ece4d3;          /* warm card-stock background */
  --paper-raised:#f6f0e2;   /* lighter surface for panels */
  --ink:#2a2620;            /* warm near-black for text and icon circles */
  --ink-soft:#574f40;       /* muted warm brown for secondary text */
  --line:#d8cdb6;           /* soft warm hairline, used for the ring */
  --accent:#9c3b2b;         /* bound-book brick, the one strong colour */
  --glow:#e6a766;           /* warm studio light for the hover bloom */

  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Charter",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Consolas,monospace;

  --wrap:880px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:var(--sans);
  color:var(--ink);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 16%, #f1ead9 0%, var(--paper) 58%, #e4dac6 100%);
}

/* ---------- shared layout ---------- */
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px;width:100%}
main{display:block}
main:focus{outline:none}
.view{animation:viewIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ---------- inner-page header ---------- */
.site-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 0 10px}
.wordmark{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:8px 2px;transition:color .25s ease;
}
.wordmark:hover{color:var(--accent)}
.back-btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;cursor:pointer;transition:all .25s ease;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--paper-raised)}
.back-btn .arr{font-family:var(--serif);font-size:15px;line-height:1;transition:transform .25s ease}
.back-btn:hover .arr{transform:translateX(-4px)}

/* ---------- hub: title block (top-left) ---------- */
.hub-head{padding:36px 0 0}
.hub-name{font-family:var(--serif);font-weight:600;font-size:clamp(40px,8vw,66px);line-height:1;letter-spacing:-.015em}
.hub-role{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft);margin-top:14px}
.hub-intro{font-family:var(--sans);font-size:clamp(15.5px,2.4vw,17px);line-height:1.6;color:var(--ink-soft);margin-top:18px;max-width:46ch}

/* ---------- hub: the ring of circles ---------- */
.stage{position:relative;width:clamp(320px,84vw,540px);aspect-ratio:1/1;margin:38px auto 10px}
.ring{
  position:absolute;top:50%;left:50%;width:68%;height:68%;transform:translate(-50%,-50%);
  border:1.5px solid var(--line);border-radius:50%;pointer-events:none;
}

/* each circle is a button; its size equals the node so it sits exactly on the ring */
.node{
  position:absolute;transform:translate(-50%,-50%);
  width:clamp(90px,23vw,126px);height:clamp(90px,23vw,126px);
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;color:inherit;
}
.node-top{top:16%;left:50%}
.node-right{top:50%;left:84%}
.node-bottom{top:84%;left:50%}
.node-left{top:50%;left:16%}
.node-centre{top:50%;left:50%}
.node-centre .node-face{background:var(--accent);color:var(--paper);box-shadow:0 12px 30px rgba(156,59,43,.26)}
.node-centre:hover .node-face,.node-centre:focus-visible .node-face{filter:brightness(1.07)}

.node-glow{
  position:absolute;inset:-30%;border-radius:50%;z-index:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle, rgba(230,167,102,.62) 0%, rgba(230,167,102,0) 68%);
  transition:opacity .5s ease;
}
.node-face{
  position:relative;z-index:1;width:100%;height:100%;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--paper);
  box-shadow:0 10px 26px rgba(42,38,32,.18);
  transition:transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s ease, background .45s ease, filter .45s ease;
}
.node-icon{width:44%;height:44%}
.node-icon svg{width:100%;height:100%;display:block}

.node-portrait .node-face{background:none;box-shadow:none;border:4px solid var(--paper-raised)}
.node-portrait .node-face img{width:100%;height:100%;object-fit:cover;display:block}

.node-label{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:13px;white-space:nowrap;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  transition:color .3s ease;
}

/* hover and keyboard-focus: warm the circle, light the glow */
.node:hover .node-face,.node:focus-visible .node-face{transform:scale(1.06);box-shadow:0 16px 40px rgba(156,59,43,.30)}
.node:not(.node-portrait):hover .node-face,
.node:not(.node-portrait):focus-visible .node-face{background:var(--accent)}
.node-portrait:hover .node-face,
.node-portrait:focus-visible .node-face{filter:saturate(1.06) brightness(1.05)}
.node:hover .node-glow,.node:focus-visible .node-glow{opacity:1}
.node:hover .node-label,.node:focus-visible .node-label{color:var(--accent)}
.node:focus-visible{outline:none}
.node:focus-visible .node-face{box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--accent), 0 16px 40px rgba(156,59,43,.30)}

.hub-hint{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);opacity:.85;margin-top:34px}

/* ---------- inner room (placeholder) ---------- */
.room-page{padding:30px 0 10px;max-width:660px}
.page-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.page-title{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6.4vw,52px);line-height:1.06;letter-spacing:-.015em;margin-top:14px}
.page-copy{font-size:clamp(16px,2.6vw,17.5px);color:var(--ink);margin-top:22px}
.page-copy + .page-copy{margin-top:14px}
.tag{
  display:inline-flex;align-items:center;gap:9px;margin-top:30px;
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:999px;padding:8px 15px;background:var(--paper-raised);
}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.page-note{font-size:15px;color:var(--ink-soft);margin-top:16px;line-height:1.7}
.page-back{
  margin-top:40px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);background:none;border:none;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:9px;
}
.page-back .arr{font-family:var(--serif);font-size:15px;transition:transform .25s ease}
.page-back:hover .arr{transform:translateX(-4px)}

/* ---------- how I lead ---------- */
.lead-lede{font-family:var(--serif);font-size:clamp(19px,3.2vw,23px);line-height:1.5}
.lead-principles{margin-top:40px;display:flex;flex-direction:column;gap:26px}
.lead-principle{position:relative;padding-left:56px}
.lead-principle-n{position:absolute;left:0;top:1px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper-raised);color:var(--accent);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center}
.lead-principle-title{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);line-height:1.2}
.lead-principle-text{font-size:15.5px;line-height:1.66;color:var(--ink-soft);margin-top:7px;max-width:54ch}

/* ---------- footer ---------- */
.site-footer{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:56px;padding:22px 0 40px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
}

/* ---------- about: the vertical timeline ---------- */
.tl-head{max-width:680px;margin:8px auto 0}
.tl-hint{font-size:14.5px;color:var(--ink-soft);margin-top:14px;font-style:italic}
.tl{position:relative;max-width:680px;margin:18px auto 0}
.tl-spine{position:absolute;left:26px;width:2px;background:var(--line);border-radius:2px;top:0;height:0;overflow:hidden}
.tl-spine::after{content:'';position:absolute;top:0;bottom:0;left:0;right:0;background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);background-size:100% 200px;background-repeat:no-repeat;animation:tlShimmer 4.2s linear infinite;pointer-events:none}
.tl-spine-fill{position:absolute;left:25px;width:4px;background:var(--accent);border-radius:2px;top:0;height:0;transition:height .6s cubic-bezier(.4,0,.2,1)}
.tl-spine-fill::after{content:'';position:absolute;left:50%;bottom:0;width:16px;height:16px;transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(circle, rgba(255,241,224,.95) 0%, rgba(230,167,102,0) 70%);opacity:0;transition:opacity .25s ease;pointer-events:none}
.tl-spine-fill.tl-moving::after{opacity:1}
@keyframes tlShimmer{0%{background-position:0 -200px}100%{background-position:0 calc(100% + 200px)}}
.tl-step{position:relative;display:flex;gap:22px;align-items:flex-start}
.tl-rail{position:relative;width:54px;flex-shrink:0;display:flex;justify-content:center;padding-top:2px}
.tl-node{position:relative;width:54px;height:54px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;font-family:inherit;color:inherit}
.tl-glow{position:absolute;inset:-32%;border-radius:50%;background:radial-gradient(circle,rgba(230,167,102,.65) 0%,rgba(230,167,102,0) 68%);opacity:0;pointer-events:none;z-index:0}
.tl-dot{position:relative;z-index:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;background:var(--line);color:transparent;width:16px;height:16px;font-size:0;box-shadow:0 4px 12px rgba(42,38,32,.12);transition:width .4s cubic-bezier(.2,.7,.2,1),height .4s cubic-bezier(.2,.7,.2,1),background .4s ease,color .3s ease,border-color .4s ease}
.tl-card-wrap{flex:1;min-width:0;padding-bottom:42px}
.tl-card{position:relative;background:var(--ink);color:#efe5d2;border-radius:18px;padding:22px 26px 24px;box-shadow:0 12px 28px rgba(42,38,32,.16);display:none}
.tl-card-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(239,229,210,.6);margin-bottom:8px}
.tl-card-title{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2;color:#f4ecda}
.tl-card-text{font-size:14.5px;line-height:1.66;color:rgba(239,229,210,.82);margin-top:10px;max-width:48ch}
.tl-stamp{position:absolute;bottom:-18px;right:26px;width:48px;height:48px;border-radius:50%;background:#efe5d2;color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--paper),0 6px 16px rgba(42,38,32,.22)}
.tl-stamp svg{width:22px;height:22px}

/* a faded, warm-tinted photo behind a card, with a vignette pulling the edges into shadow.
   the left side stays darker so the cream text keeps its contrast. */
.tl-card-bg{position:absolute;inset:0;border-radius:18px;overflow:hidden;z-index:0;opacity:0;pointer-events:none}
.tl-card-bg::before{content:'';position:absolute;inset:0;background-image:var(--img);background-size:var(--img-size,cover);background-position:var(--img-pos,center);background-repeat:no-repeat;filter:sepia(.42) saturate(.75) brightness(.5) contrast(1.03)}
.tl-card-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg, rgba(26,22,17,.9) 0%, rgba(26,22,17,.55) 52%, rgba(26,22,17,.18) 100%), radial-gradient(125% 120% at 78% 32%, rgba(26,22,17,0) 28%, rgba(26,22,17,.72) 100%)}
.tl-card-eyebrow,.tl-card-title,.tl-card-text,.tl-now{position:relative;z-index:1}
.tl-step.is-revealed .tl-card-bg{animation:tlBgIn 1.1s ease .12s both}
@keyframes tlBgIn{from{opacity:0}to{opacity:1}}

/* node states: locked, frontier (next to click), revealed */
.tl-step.is-locked .tl-node{cursor:default}
.tl-step.is-frontier .tl-node{cursor:pointer}
.tl-step.is-frontier .tl-dot{width:36px;height:36px;background:var(--paper-raised);border:2px solid var(--accent);color:var(--accent);font-size:12px;animation:tlPulse 1.9s ease-in-out infinite}
.tl-step.is-revealed .tl-node{cursor:pointer}
.tl-step.is-revealed .tl-dot{width:54px;height:54px;background:var(--ink);color:#efe5d2;font-size:14px;border:0;animation:tlPress .5s cubic-bezier(.2,.8,.25,1) both}
.tl-step.is-revealed.branch .tl-dot{background:var(--accent);color:#faf4e8}
.tl-step.is-revealed .tl-card{display:block;animation:tlCardIn .5s ease both}
.tl-step.branch .tl-card-eyebrow{color:var(--glow)}

/* 7.5 as a side step: the node offsets to the right, a branch line links it to the spine */
.tl-step.branch .tl-rail{width:124px;justify-content:flex-end}
.tl-branch-line{position:absolute;left:27px;top:28px;width:70px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.tl-branch-fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* a "click to reveal" cue, shown only on the next step in line */
.tl-cue{display:none;align-items:center;gap:10px;padding-top:9px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.tl-step.is-frontier .tl-cue{display:inline-flex;animation:tlCardIn .4s ease both}
.tl-cue .arr{font-family:var(--serif);font-size:17px;line-height:1;animation:tlNudge 1.4s ease-in-out infinite}
@keyframes tlNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}

/* the present: the final step, marked as "Now" with a quiet, breathing glow */
.tl-now{position:absolute;top:-12px;right:24px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:var(--glow);padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(230,167,102,.45)}
@keyframes tlNowGlow{0%,100%{opacity:.3}50%{opacity:.75}}
.tl-node:focus-visible{outline:none}
.tl-step.is-frontier .tl-node:focus-visible .tl-dot,
.tl-step.is-revealed .tl-node:focus-visible .tl-dot{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--accent)}
@keyframes tlPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes tlGlow{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
@keyframes tlCardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tl-step.is-revealed .tl-stamp{animation:tlStamp .55s cubic-bezier(.2,.8,.25,1) both}
@keyframes tlPress{0%{transform:scale(.7)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes tlStamp{0%{opacity:0;transform:scale(.3) rotate(-10deg)}55%{opacity:1;transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

/* header actions: sound toggle sits beside Back */
.header-actions{display:flex;align-items:center;gap:12px}
.sound-toggle{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;background:var(--paper-raised);border:1px solid var(--line);border-radius:50%;color:var(--accent);cursor:pointer;padding:0;transition:all .2s ease}
.sound-toggle:hover{background:#efe1d8;border-color:var(--accent)}
.sound-toggle.muted{color:var(--ink-soft);background:var(--paper)}
.sound-toggle svg{width:17px;height:17px}

/* hub top bar (holds the mute toggle on the landing) */
.hub-top{display:flex;justify-content:flex-end;align-items:center;padding:18px 0 0}

/* responsive video embed for the sample video */
.video-embed{position:relative;width:100%;aspect-ratio:16/9;margin-top:26px;border-radius:16px;overflow:hidden;background:var(--ink);box-shadow:0 14px 32px rgba(42,38,32,.18)}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

@media (max-width:640px){
  .tl{margin-top:14px}
  .tl-step{gap:16px}
  .tl-card{padding:18px 20px 20px}
  .tl-card-text{font-size:14px}
  .tl-stamp{width:42px;height:42px;right:18px}
  .tl-step.branch .tl-rail{width:88px}
  .tl-branch-line{width:34px}
}
@media (prefers-reduced-motion:reduce){
  .tl-spine-fill{transition:none}
  .tl-branch-fill{transition:none}
  .tl-spine::after{animation:none;opacity:0}
  .tl-spine-fill.tl-moving::after{opacity:0}
  .tl-step.is-frontier .tl-dot{animation:none}
  .tl-step.is-revealed .tl-card{animation:none}
  .tl-step.is-revealed .tl-dot{animation:none}
  .tl-step.is-revealed .tl-stamp{animation:none}
  .tl-step.is-revealed .tl-card-bg{animation:none;opacity:1}
  .tl-cue .arr{animation:none}
}

/* ---------- responsive: ring folds to a 2x2 grid on small screens ---------- */
@media (max-width:640px){
  .wrap{padding:0 20px}
  .hub-head{padding:28px 0 0}
  .stage{position:static;width:auto;max-width:360px;aspect-ratio:auto;display:grid;grid-template-columns:1fr 1fr;gap:48px 10px;margin:30px auto 6px}
  .ring{display:none}
  .node-centre{grid-column:1 / -1;justify-self:center;order:-1}
  .node{position:static;transform:none;justify-self:center;width:clamp(86px,32vw,118px);height:clamp(86px,32vw,118px)}
  .node:hover .node-face,.node:focus-visible .node-face{transform:scale(1.05)}
  .site-footer{justify-content:center;text-align:center}
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .node:hover .node-face,.node:focus-visible .node-face{transform:none}
}

/* ---------- credentials gallery ---------- */
.creds{max-width:680px;margin:10px auto 0;padding-top:14px}
.creds-head{max-width:680px}
.creds-title{font-family:var(--serif);font-weight:600;font-size:clamp(24px,5vw,32px);line-height:1.12;letter-spacing:-.015em;margin-top:10px}
.creds-note{font-size:14.5px;color:var(--ink-soft);margin-top:12px;font-style:italic;line-height:1.7;max-width:60ch}
.cred-viewer{display:flex;align-items:center;gap:12px;margin-top:26px}
.cred-viewer:focus-visible{outline:none}
.cred-viewer:focus-visible .cred-stage{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--accent),0 12px 28px rgba(42,38,32,.16)}
.cred-stage{flex:1;min-width:0;border-radius:14px;overflow:hidden;background:var(--paper-raised);border:1px solid var(--line);box-shadow:0 12px 28px rgba(42,38,32,.16)}
.cred-frame{display:block;width:100%;border:none;padding:0;margin:0;background:none;cursor:zoom-in;font:inherit;color:inherit}
.cred-frame:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--accent)}
.cred-img{display:block;width:100%;height:auto;transition:opacity .35s ease}
.cred-arrow{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper-raised);color:var(--accent);font-family:var(--serif);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.cred-arrow:hover{background:#efe1d8;border-color:var(--accent)}
.cred-arrow:focus-visible{outline:none;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent)}
.cred-cap{text-align:center;margin-top:16px;min-height:46px}
.cred-cap-title{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink)}
.cred-cap-meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.cred-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:16px}
.cred-dot{width:8px;height:8px;border-radius:50%;border:none;padding:0;background:var(--line);cursor:pointer;transition:all .25s ease}
.cred-dot.is-on{background:var(--accent);transform:scale(1.25)}
.cred-dot:focus-visible{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
.cred-lightbox{position:fixed;inset:0;z-index:90;background:rgba(26,22,17,.82);display:flex;align-items:center;justify-content:center;padding:32px;animation:credFade .25s ease both}
.cred-lightbox img{max-width:min(1100px,94vw);max-height:90vh;width:auto;height:auto;border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.cred-lb-close{position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(239,229,210,.4);background:rgba(26,22,17,.5);color:#efe5d2;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cred-lb-close:hover{background:rgba(26,22,17,.8)}
@keyframes credFade{from{opacity:0}to{opacity:1}}
@media (max-width:640px){
  .cred-viewer{gap:8px}
  .cred-arrow{width:40px;height:40px;font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .cred-img{transition:none}
  .cred-lightbox{animation:none}
  .cred-dot{transition:none}
}
</style>

function tone(freq, dur, peak, delay){
  if(!soundOn) return;
  var c = ac(); if(!c) return;
  try{
    var now = c.currentTime + (delay||0);
    var o = c.createOscillator(), g = c.createGain();

  }catch(e){}
}

/* ---------- inner-page header ---------- */
function buildSoundToggle(){
  var snd = document.createElement('button');
  snd.className = 'sound-toggle' + (soundOn ? '' : ' muted');
  snd.type = 'button';
  snd.innerHTML = soundOn ? AUDIO_ON_ICON : AUDIO_OFF_ICON;
  snd.title = soundOn ? 'Sound on, tap to mute' : 'Sound off, tap to enable';
  snd.setAttribute('aria-label', snd.title);
  snd.addEventListener('click', function(){
    soundOn = !soundOn;
    snd.classList.toggle('muted', !soundOn);
    snd.innerHTML = soundOn ? AUDIO_ON_ICON : AUDIO_OFF_ICON;
    snd.title = soundOn ? 'Sound on, tap to mute' : 'Sound off, tap to enable';
    snd.setAttribute('aria-label', snd.title);
    if (soundOn) playTick();
  });
  return snd;
}

  return header;

/* ---------- about: the vertical timeline ---------- */
function tlCentreY(i){
  var r = tlNodes[i].getBoundingClientRect();
  var t = tlContainer.getBoundingClientRect();
  return (r.top - t.top) + r.height / 2;
}

function tlLayoutSpine(){
  if (!tlNodes.length) return;
  var c0 = tlCentreY(0);
  var cl = tlCentreY(tlNodes.length - 1);
  tlSpine.style.top = c0 + 'px';
  tlSpine.style.height = Math.max(0, cl - c0) + 'px';
  tlFill.style.top = c0 + 'px';
  var rk = tlRevealed < 0 ? 0 : tlRevealed;
  var keep = tlFill.style.transition;
  tlFill.style.transition = 'none';
  tlFill.style.height = Math.max(0, tlCentreY(rk) - c0) + 'px';
  void tlFill.offsetHeight;
  tlFill.style.transition = keep;
  tlSteps.forEach(function(step, i){
    if (TIMELINE[i].branch){
      var bf = step.querySelector('.tl-branch-fill');
      if (bf){ var k2 = bf.style.transition; bf.style.transition = 'none'; bf.style.width = (i <= tlRevealed ? '100%' : '0'); void bf.offsetWidth; bf.style.transition = k2; }
    }
  });
}

function tlSetStates(){
  tlSteps.forEach(function(step, i){
    var node = tlNodes[i];
    step.classList.remove('is-locked','is-frontier','is-revealed');
    if (i <= tlRevealed){ step.classList.add('is-revealed'); node.disabled = false; }
    else if (i === tlRevealed + 1){ step.classList.add('is-frontier'); node.disabled = false; }
    else { step.classList.add('is-locked'); node.disabled = true; }
  });
}

function tlInit(){
  tlRevealed = 0;
  tlSetStates();
  tlLayoutSpine();
}

function tlOnClick(i){
  if (i <= tlRevealed){ tlSteps[i].scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', block:'center' }); return; }
  if (i === tlRevealed + 1){ tlAdvance(i); }
}

function tlAdvance(k){
  if (tlAnimating) return;
  tlAnimating = true;
  playTick();
  tlSteps[k].classList.remove('is-frontier');
  var c0 = tlCentreY(0);
  var target = Math.max(0, tlCentreY(k) - c0);
  var isBranch = !!TIMELINE[k].branch;

  if (prefersReduced){
    tlFill.style.transition = 'none';
    tlFill.style.height = target + 'px';
    void tlFill.offsetHeight;
    tlFill.style.transition = '';
    if (isBranch){ var bfR = tlSteps[k].querySelector('.tl-branch-fill'); if (bfR){ bfR.style.transition = 'none'; bfR.style.width = '100%'; } }
    tlFinish(k);
    return;
  }

  var done1 = false;
  var onMain = function(){
    if (done1) return;
    done1 = true;
    tlFill.classList.remove('tl-moving');
    tlFill.removeEventListener('transitionend', onMain);
    if (isBranch){
      var bf = tlSteps[k].querySelector('.tl-branch-fill');
      if (bf){
        var done2 = false;
        var onBranch = function(){ if (done2) return; done2 = true; bf.removeEventListener('transitionend', onBranch); tlFinish(k); };
        bf.addEventListener('transitionend', onBranch);
        setTimeout(onBranch, 640);
        bf.style.width = '100%';
      } else { tlFinish(k); }
    } else {
      tlFinish(k);
    }
  };
  tlFill.classList.add('tl-moving');
  tlFill.addEventListener('transitionend', onMain);
  setTimeout(onMain, 820);
  tlFill.style.height = target + 'px';
}

function tlFinish(k){
  tlRevealed = k;
  tlSetStates();
  var glow = tlNodes[k].querySelector('.tl-glow');
  if (glow && !prefersReduced){
    if (TIMELINE[k].present){ glow.style.animation = 'tlNowGlow 3s ease-in-out infinite'; }
    else { glow.style.animation = 'none'; void glow.offsetHeight; glow.style.animation = 'tlGlow 1.1s ease-out 1'; }
  }
  playLand();
  tlSteps[k].scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', block:'center' });
  requestAnimationFrame(function(){
    if (!tlNodes.length) return;
    var c0 = tlCentreY(0), cl = tlCentreY(tlNodes.length - 1);
    tlSpine.style.height = Math.max(0, cl - c0) + 'px';
  });
  tlAnimating = false;
}

function buildCredentials(){
  var sec = document.createElement('section');
  sec.className = 'creds';
  sec.setAttribute('aria-labelledby','creds-title');

  var head = document.createElement('div');
  head.className = 'creds-head';
  head.innerHTML =
    '<div class="page-eyebrow">Credentials</div>' +
    '<h2 class="creds-title" id="creds-title">Qualifications and certificates</h2>' +
    '<p class="creds-note">I\u2019m also working towards the CIPD Level 7 Advanced Diploma in Strategic Learning and Development.</p>';
  sec.appendChild(head);

  var idx = 0;

  var viewer = document.createElement('div');
  viewer.className = 'cred-viewer';
  viewer.tabIndex = 0;
  viewer.setAttribute('role','group');
  viewer.setAttribute('aria-roledescription','carousel');
  viewer.setAttribute('aria-label','Certificates. Use the left and right arrow keys to move through them.');

  var prev = document.createElement('button');
  prev.type='button'; prev.className='cred-arrow'; prev.setAttribute('aria-label','Previous certificate'); prev.innerHTML='&#8249;';

  var stage = document.createElement('div'); stage.className='cred-stage';
  var frame = document.createElement('button'); frame.type='button'; frame.className='cred-frame'; frame.setAttribute('aria-label','Enlarge this certificate');
  var img = document.createElement('img'); img.className='cred-img'; img.loading='lazy';
  frame.appendChild(img); stage.appendChild(frame);

  var next = document.createElement('button');
  next.type='button'; next.className='cred-arrow'; next.setAttribute('aria-label','Next certificate'); next.innerHTML='&#8250;';

  viewer.appendChild(prev); viewer.appendChild(stage); viewer.appendChild(next);
  sec.appendChild(viewer);

  var cap = document.createElement('div'); cap.className='cred-cap';
  cap.innerHTML = '<div class="cred-cap-title"></div><div class="cred-cap-meta"></div>';
  sec.appendChild(cap);
  var capTitle = cap.querySelector('.cred-cap-title');
  var capMeta  = cap.querySelector('.cred-cap-meta');

  var dots = document.createElement('div'); dots.className='cred-dots';
  var dotEls = [];
  CERTS.forEach(function(c,i){
    var d=document.createElement('button'); d.type='button'; d.className='cred-dot';
    d.setAttribute('aria-label','Show certificate '+(i+1)+' of '+CERTS.length+', '+c.title);
    d.addEventListener('click', function(){ credGo(i, true); });
    dots.appendChild(d); dotEls.push(d);
  });
  sec.appendChild(dots);

  function paint(i){
    var c = CERTS[i];
    img.src = CERT_IMG[c.key];
    img.alt = c.alt;
    capTitle.textContent = c.title;
    capMeta.textContent = c.meta;
    dotEls.forEach(function(d,di){ d.classList.toggle('is-on', di===i); d.setAttribute('aria-current', di===i ? 'true':'false'); });
  }

  function credGo(i, focusViewer){
    i = (i + CERTS.length) % CERTS.length;
    idx = i;
    if (prefersReduced){ paint(i); }
    else {
      img.style.opacity = '0';
      setTimeout(function(){ paint(i); img.style.opacity='1'; }, 170);
    }
    if (focusViewer) viewer.focus();
  }

  prev.addEventListener('click', function(){ credGo(idx-1, false); });
  next.addEventListener('click', function(){ credGo(idx+1, false); });

  viewer.addEventListener('keydown', function(e){
    if (e.key==='ArrowLeft'){ e.preventDefault(); credGo(idx-1, true); }
    else if (e.key==='ArrowRight'){ e.preventDefault(); credGo(idx+1, true); }
  });

  var sx=null;
  stage.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (sx===null) return;
    var dx=e.changedTouches[0].clientX - sx;
    if (Math.abs(dx)>40){ if (dx<0) credGo(idx+1, true); else credGo(idx-1, true); }
    sx=null;
  });

  frame.addEventListener('click', function(){ openLightbox(idx); });

  function openLightbox(i){
    var c = CERTS[i];
    var lb = document.createElement('div'); lb.className='cred-lightbox';
    var im = document.createElement('img'); im.src=CERT_IMG[c.key]; im.alt=c.alt;
    var close = document.createElement('button'); close.type='button'; close.className='cred-lb-close'; close.setAttribute('aria-label','Close enlarged certificate'); close.innerHTML='&times;';
    lb.appendChild(close); lb.appendChild(im);
    document.body.appendChild(lb);
    document.body.style.overflow='hidden';
    if (typeof playLand==='function') playLand();
    function shut(){ if (lb.parentNode) document.body.removeChild(lb); document.body.style.overflow=''; document.removeEventListener('keydown', onKey); frame.focus(); }
    function onKey(e){ if (e.key==='Escape') shut(); }
    close.addEventListener('click', shut);
    lb.addEventListener('click', function(e){ if (e.target===lb) shut(); });
    document.addEventListener('keydown', onKey);
    close.focus();
  }

  paint(0);
  return sec;
}


function buildAbout(){
  tlRevealed = -1; tlAnimating = false; tlNodes = []; tlSteps = [];

  var frag = document.createElement('div');

  var head = document.createElement('div');
  head.className = 'tl-head';
  head.innerHTML = '<div class="page-eyebrow">About</div>' +
                   '<h1 class="page-title">The story so far</h1>' +
                   '<p class="tl-hint">A path from there to here. Click the pulsing circle to reveal each step.</p>';
  frag.appendChild(head);

  var tl = document.createElement('div');
  tl.className = 'tl';

  var spine = document.createElement('div'); spine.className = 'tl-spine'; spine.setAttribute('aria-hidden','true');
  var fill = document.createElement('div'); fill.className = 'tl-spine-fill'; fill.setAttribute('aria-hidden','true');
  tl.appendChild(spine); tl.appendChild(fill);

  TIMELINE.forEach(function(step, i){
    var s = document.createElement('div');
    s.className = 'tl-step is-locked' + (step.branch ? ' branch' : '') + (step.present ? ' present' : '');

    var rail = document.createElement('div'); rail.className = 'tl-rail';
    if (step.branch){
      var bl = document.createElement('div'); bl.className = 'tl-branch-line'; bl.setAttribute('aria-hidden','true');
      var bf = document.createElement('span'); bf.className = 'tl-branch-fill';
      bl.appendChild(bf); rail.appendChild(bl);
    }
    var node = document.createElement('button'); node.className = 'tl-node'; node.type = 'button';
    node.disabled = true;
    node.setAttribute('aria-label', 'Step ' + step.num + ', ' + step.title);
    node.innerHTML = '<span class="tl-glow" aria-hidden="true"></span><span class="tl-dot">' + step.num + '</span>';
    node.addEventListener('click', (function(idx){ return function(){ tlOnClick(idx); }; })(i));
    rail.appendChild(node);

    var cw = document.createElement('div'); cw.className = 'tl-card-wrap';
    var card = document.createElement('div'); card.className = 'tl-card';
    var cardHTML = '<div class="tl-card-eyebrow">' + step.eyebrow + '</div>' +
                   '<div class="tl-card-title">' + step.title + '</div>' +
                   '<div class="tl-card-text">' + step.text + '</div>' +
                   '<span class="tl-stamp" aria-hidden="true">' + TL_ICONS[step.icon] + '</span>';
    if (step.present){ cardHTML = '<span class="tl-now" aria-hidden="true">Now</span>' + cardHTML; }
    var bgStyle = "--img:url('" + step.img + "')";
    if (step.imgPos){ bgStyle += ';--img-pos:' + step.imgPos; }
    if (step.imgSize){ bgStyle += ';--img-size:' + step.imgSize; }
    var bgHTML = step.img ? '<div class="tl-card-bg" aria-hidden="true" style="' + bgStyle + '"></div>' : '';
    card.innerHTML = bgHTML + cardHTML;
    if (step.img){
      (function(cardEl, src){
        var bgEl = cardEl.querySelector('.tl-card-bg');
        if (!bgEl) return;
        var probe = new Image();
        probe.onerror = function(){ if (bgEl.parentNode) bgEl.parentNode.removeChild(bgEl); };
        probe.src = src;
      })(card, step.img);
    }
    cw.appendChild(card);

    var cue = document.createElement('div'); cue.className = 'tl-cue'; cue.setAttribute('aria-hidden','true');
    cue.innerHTML = '<span class="arr">&larr;</span> Click to reveal';
    cw.appendChild(cue);

    s.appendChild(rail); s.appendChild(cw);
    tl.appendChild(s);
    tlNodes.push(node); tlSteps.push(s);
  });
  frag.appendChild(tl);

  frag.appendChild(buildCredentials());

  var back = document.createElement('button');
  back.className = 'page-back'; back.type = 'button';
  back.innerHTML = '<span class="arr">&larr;</span> Back to the start';
  back.addEventListener('click', function(){ playBack(); go('hub'); });
  frag.appendChild(back);

  tlContainer = tl; tlSpine = spine; tlFill = fill;
  requestAnimationFrame(function(){ requestAnimationFrame(tlInit); });
  return frag;
}

function buildLead(){
  var frag = document.createElement('div');
  var page = document.createElement('section');
  page.className = 'room-page';
  page.innerHTML =
    '<div class="page-eyebrow">Leadership</div>' +
    '<h1 class="page-title">How I lead</h1>' +
    '<p class="page-copy lead-lede">I build what a business is missing. My career has been about joining functions that were already good and adding what they lacked: a first management development programme, a first digital learning capability, a first LMS.</p>' +
    '<p class="page-copy">I lead the same way. Find the real gap, make the case for closing it, and build something that lasts and that the business will actually use. And I want that work to reach everyone it should, from a brand new operative in a site cabin to the executive team.</p>' +
    '<div class="lead-principles">' +
      '<div class="lead-principle"><div class="lead-principle-n" aria-hidden="true">1</div><div class="lead-principle-title">Build what’s missing</div><div class="lead-principle-text">I start from the gap, not the trend. I work out what a function actually lacks, design for that, and build it in-house rather than buying in something that doesn’t quite fit.</div></div>' +
      '<div class="lead-principle"><div class="lead-principle-n" aria-hidden="true">2</div><div class="lead-principle-title">Lead by influence, not by mandate</div><div class="lead-principle-text">Most of what I’ve changed, I’ve changed without the authority to insist on it. Across a federated business of autonomous divisions, I make the case to managing directors and the executive, agree the measures up front, and earn the decision to roll out company-wide.</div></div>' +
      '<div class="lead-principle"><div class="lead-principle-n" aria-hidden="true">3</div><div class="lead-principle-title">Grow the people who do the work</div><div class="lead-principle-text">A function is only as strong as the team behind it. I develop my people and hand them real ownership, devolving design, build and platform so the capability lives in the team, not just in me.</div></div>' +
    '</div>';
  var back = document.createElement('button');
  back.className = 'page-back'; back.type = 'button';
  back.innerHTML = '<span class="arr">&larr;</span> Back to the start';
  back.addEventListener('click', function(){ playBack(); go('hub'); });
  page.appendChild(back);
  frag.appendChild(page);
  return frag;
}

function render(){
  var app = document.getElementById('app');
  app.innerHTML = '';

  var shell = document.createElement('div');
  shell.className = 'wrap';

  var content = document.createElement('main');
  content.className = 'view';
  content.setAttribute('tabindex','-1');

  if (view === 'hub'){
    content.appendChild(buildHub());
  } else if (view === 'about'){
    shell.appendChild(buildHeader(true));
    content.appendChild(buildAbout());
  } else if (view === 'film'){
    shell.appendChild(buildHeader(false));
    content.appendChild(buildFilm());
  } else if (view === 'lead'){
    shell.appendChild(buildHeader(false));
    content.appendChild(buildLead());
  } else {
    shell.appendChild(buildHeader(false));
    content.appendChild(buildRoom(view));
  }

  shell.appendChild(content);
  app.appendChild(shell);

  content.focus({ preventScroll:true });
}

window.addEventListener('resize', function(){ if (view === 'about' && tlNodes.length){ tlLayoutSpine(); } });

render();
</script>
</body>
</html>
